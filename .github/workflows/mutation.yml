name: Mutation testing
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 6"
permissions:
  contents: read
jobs:
  mutation-test:
    strategy:
      fail-fast: false
      matrix:
        scope: [core, delivery, search, scheduling, storage]
    name: Mutation / ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore and build test subprocess
        run: |
          dotnet restore DataStructureAndAlgorithm.slnx
          dotnet tool restore
          dotnet build DataStructureAndAlgorithm.slnx -c Release --no-restore
      - name: Mutation gate
        working-directory: DataStructureAndAlgorithm.Test
        run: dotnet stryker --config-file stryker-${{ matrix.scope }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ matrix.scope }}
          path: DataStructureAndAlgorithm.Test/StrykerOutput
          if-no-files-found: warn
