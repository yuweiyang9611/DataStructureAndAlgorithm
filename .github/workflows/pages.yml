name: Deploy learning site to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tools/check_site_rendering.mjs"
      - "tools/generate_site_traces.mjs"
      - "tools/bundle_site_source.mjs"
      - "tools/build_browser_runtime.mjs"
      - "tools/check_browser_runtime.mjs"
      - "tools/browser-runtime/**"
      - "DataStructureAndAlgorithm*/**"
      - "DataStructureAndAlgorithm.slnx"
      - "Directory.Build.*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build learning site
    runs-on: ubuntu-latest
    # The browser runtime publish (Roslyn on WebAssembly) takes a few minutes on top of the site build.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Install the WebAssembly workloads for the browser runtime
        run: dotnet workload install wasm-tools wasm-experimental

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install site dependencies
        run: npm ci

      - name: Generate Trace assets from C# demos
        run: npm run docs:traces

      - name: Check committed Trace assets are current
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- docs/public/traces)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: Build the browser runtime and verify the 22 demos
        run: npm run docs:runtime

      - name: Build VitePress site
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy learning site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
