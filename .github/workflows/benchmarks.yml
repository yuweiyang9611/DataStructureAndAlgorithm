name: Scenario Benchmarks
on:
  pull_request:
    paths: ["DataStructureAndAlgorithm*/**", "tools/benchmark_report.mjs", ".github/workflows/benchmarks.yml"]
  workflow_dispatch:
    inputs:
      job:
        description: Measurement job
        type: choice
        options: [Short, Default]
        default: Short
  schedule:
    - cron: "0 2 * * 1"
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        group: [Search, Delivery, Scheduling, Exact, Storage]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore previous same-group report
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
        shell: bash
        run: |
          run_id="$(gh run list --workflow benchmarks.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name "benchmark-$GROUP" --dir previous || true
          fi
      - name: Measure
        env:
          GROUP: ${{ matrix.group }}
          JOB: ${{ github.event_name == 'pull_request' && 'Dry' || inputs.job || 'Short' }}
        shell: bash
        run: |
          args=(--filter "*${GROUP}*ScalingScenarioBenchmarks*" --exporters json markdown --artifacts BenchmarkDotNet.Artifacts)
          if [ "$JOB" != Default ]; then args+=(--job "$JOB"); fi
          dotnet run --project DataStructureAndAlgorithm.Benchmarks -c Release -- "${args[@]}"
      - name: Validate and summarize measurements
        env:
          BENCHMARK_GROUP: ${{ matrix.group }}
        run: node tools/benchmark_report.mjs BenchmarkDotNet.Artifacts previous
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ matrix.group }}
          path: BenchmarkDotNet.Artifacts
          retention-days: 90
          if-no-files-found: error
