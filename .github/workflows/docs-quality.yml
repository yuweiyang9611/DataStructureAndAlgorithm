name: Check learning site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: docs-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify docs, links and Trace assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run docs:typecheck
      - run: npm run docs:test
      - run: npm run docs:traces
      - name: Check committed Trace assets
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- docs/public/traces)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - run: npm run docs:build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run docs:test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
          retention-days: 14
