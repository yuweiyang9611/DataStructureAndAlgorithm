name: Check learning site

on:
  pull_request:
    paths:
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tools/check_site_rendering.mjs"
      - "tools/generate_site_traces.mjs"
      - "DataStructureAndAlgorithm*/**"
      - "DataStructureAndAlgorithm.slnx"
      - "global.json"
      - "Directory.Build.*"
      - ".github/workflows/docs-quality.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify docs, links and Trace assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install site dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Regenerate Trace assets
        run: npm run docs:traces

      - name: Check committed Trace assets are current
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- docs/public/traces)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: Build and verify site
        run: npm run docs:build
